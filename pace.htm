<!DOCTYPE html>
<html><head><link rel="apple-touch-icon" href="http://www.evers.no/rgt/piggy.png"></head>
      <body style="background-color:powderblue;"><meta name = "viewport" content="width=200">
      <form id="calc"><table border=1>
            <tr><td align="right">20<input id="20k" type="text" pattern="\d*" size="3" oninput="myFunction()" autofocus></td>
               <td align="right">1000<input id="1000k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
               <td align="right"><b><output id="1000l"></td>
            <tr><td align="right">10<input id="10k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
               <td align="right">500<input id="500k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
               <td align="right"><b><output id="500l"></td>
            <tr><td align="right">5<input id="5k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
               <td align="right">200<input id="200k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
               <td align="right"><b><output id="200l"></td>
            <tr><td align="right">1<input id="1k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
              <td align="right">100<input id="100k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
              <td align="right"><b><output id="100l"></td>
            <tr><td align="right"><input type="button" onclick="myReset()" value="RGT5"></td>
              <td align="right">50<input id="50k" type="text" pattern="\d*" size="3" oninput="myFunction()"></td>
              <td align="right"><b><output id="50l"</td>
            <tr><td align="right"><font color = "red"><b><output id="mynt" type="text" disabled></td>
               <td align="right"><font color = "red"><b><output id="sedler" type="text"disabled></td>
               <td align="right"><font color = "green"><b><output id="sum" type="text" disabled></td>
               </font></table></form>
      <script>
      function myFunction() {
        var a = Number(document.getElementById("1k").value);var b = Number(document.getElementById("5k").value)*5;
        var c = Number(document.getElementById("10k").value)*10;var d = Number(document.getElementById("20k").value)*20;
        var e = Number(document.getElementById("50k").value)*50;var f = Number(document.getElementById("100k").value)*100;
        var g = Number(document.getElementById("200k").value)*200;var h = Number(document.getElementById("500k").value)*500;
        var i = Number(document.getElementById("1000k").value)*1000;
          document.getElementById("sum").innerHTML = a+b+c+d+e+f+g+h+i;document.getElementById("mynt").innerHTML = a+b+c+d;
          document.getElementById("sedler").innerHTML = e+f+g+h+i;document.getElementById("50l").innerHTML = e;
          document.getElementById("100l").innerHTML = f;document.getElementById("200l").innerHTML = g;
          document.getElementById("500l").innerHTML = h;document.getElementById("1000l").innerHTML = i;}
      function myReset() {
          document.getElementById("calc").reset();
          document.getElementById("sum").innerHTML = "";document.getElementById("mynt").innerHTML = "";
          document.getElementById("sedler").innerHTML = "";document.getElementById("50l").innerHTML = "";
          document.getElementById("100l").innerHTML = "";document.getElementById("200l").innerHTML = "";
          document.getElementById("500l").innerHTML = "";document.getElementById("1000l").innerHTML = "";}
      </script></body></html>
