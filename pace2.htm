 <!DOCTYPE html>

<!-- 
i need a html code that converts my running pace (minutes and seconds per km) to minutes and seconds per 400 m, per 200 m and 100 m
-->

<html lang="en">
<head>
    <link rel="apple-touch-icon" href="https://everspaul.github.io/runfast.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Pace / Speed Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 4);
            max-width: 400px;
            width: 60%;
        }
        h3 {
            margin-top: 0;
            color: #1a73e8;
            text-align: center;
        }
        .input-group-pace {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }
        input:focus {
            outline: none;
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1557b0;
        }
        .results {
            margin-top: 25px;
<--!            border-top: 2px solid #eee; -->
            padding-top: 15px;
        }
        .result-row {
            display: flex;
	justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .distance {
            font-weight: 600;
            color: #555;
        }
        .time {
            font-weight: bold;
            color: #1a73e8;
        }
    </style>
</head>

<body>

<div class="container">
    <h3><a href="https://everspaul.github.io/pace2.htm">Pace & Speed</a></h3>

    <div class="input-group-pace">
        <div class="input-field">
            <label for="minutes">Pace min/km</label>
            <input type="number" id="minutes" min="0" max="59"	 value="5" oninput ="convertPace()" >
        </div>
        <div class="input-field">
            <label for="seconds">sec</label>
            <input type="number" id="seconds" min="0" max="59" value="0" oninput ="convertPace()">
        </div>
    </div>

    <div class="input-group-pace">
        <div class="input-field">
            <label for="for">Speed km/h</label>
            <input type="number" id="speed" min="1" max="40" value="0" oninput ="convertSpeed()">
        </div>
    </div>


<!--     <button onclick="convertPace()">Convert</button> -->

    <div class="results">
        <div class="result-row">
            <span class="distance">Pace 1000 m:</span>
            <span class="time" id="res1000">5:00</span>
        </div>
        <div class="result-row">
            <span class="distance">800 m:</span>
            <span class="time" id="res800">4:00</span>
        </div>
        <div class="result-row">
            <span class="distance">400 m:</span>
            <span class="time" id="res400">2:00</span>
        </div>
        <div class="result-row">
            <span class="distance">200 m:</span>
            <span class="time" id="res200">1:00</span>
        </div>
        <div class="result-row">
            <span class="distance">100 m:</span>
            <span class="time" id="res100">0:30</span>
        </div>
        <div class="result-row">
            <span class="distance">50 m:</span>
            <span class="time" id="res50">0:15</span>
        </div>


    </div>
</div>


<script>

    function formatTime(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = Math.floor(totalSeconds % 60);
        // Pad seconds with a leading zero if they are less than 10
        const formattedSecs = secs < 10 ? '0' + secs : secs;
        
        if (mins > 0) {
            return `${mins}:${formattedSecs}`;
        }
        return `${secs}s`;
    }

    function SpeedToPace(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60);
        const secs = Math.floor(totalSeconds % 60);
        // Pad seconds with a leading zero if they are less than 10
        const formattedSecs = secs < 10 ? '0' + secs : secs;
        
        if (mins > 0) {
            return `${mins}:${formattedSecs}`;
        }
        return `${secs}s`;
    }

    function CalculateAndDisplay(totalSecondsPerKm) {
        // Calculate split times based on proportions of a kilometer
        const time1000 = totalSecondsPerKm 
        const time800 = totalSecondsPerKm * (800 / 1000);
        const time400 = totalSecondsPerKm * (400 / 1000);
        const time200 = totalSecondsPerKm * (200 / 1000);
        const time100 = totalSecondsPerKm * (100 / 1000);
        const time50 = totalSecondsPerKm * (50 / 1000);

        // Display formatted results

        document.getElementById('res1000').innerText = formatTime(time1000);
        document.getElementById('res800').innerText = formatTime(time800);
        document.getElementById('res400').innerText = formatTime(time400);
        document.getElementById('res200').innerText = formatTime(time200);
        document.getElementById('res100').innerText = formatTime(time100);
        document.getElementById('res50').innerText = formatTime(time50);

    }

    function convertPace() {
        // Get input values
        const minInput = parseInt(document.getElementById('minutes').value) || 0;
        const secInput = parseInt(document.getElementById('seconds').value) || 0;

        // Calculate total seconds per 1000 m (1 km)
        const totalSecondsPerKm = (minInput * 60) + secInput;

        if (totalSecondsPerKm <= 0) {
            alert("Please enter a valid pace greater than 0.");
            return;
        }

	CalculateAndDisplay(totalSecondsPerKm)
    }

    function convertSpeed() {
        // Get input values
        const minInput = document.getElementById('speed').value;

        // Calculate total seconds per 1000 m (1 km)
        const totalSecondsPerKm = (3600 / minInput);

	CalculateAndDisplay(totalSecondsPerKm)

    }
</script>

</body>
</html>
